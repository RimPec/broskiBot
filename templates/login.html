{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card p-4 shadow-sm">
            <h4 class="mb-3">Login</h4>
            <form method="POST">
                <div class="mb-3"><label>Username</label><input type="text" name="uid" class="form-control" required></div>
                <div class="mb-3"><label>Password</label><input type="password" name="pwd" class="form-control" required></div>
                <button type="submit" class="btn btn-primary w-100 mb-2">Login</button>
                <a href="{{ url_for('register') }}" class="small">Need an account? Register</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
